name: Sync main → dev---InfinityFree

on:
  push:
    branches: [main]

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge main into dev---InfinityFree
        run: |
          git fetch origin
          git checkout dev---InfinityFree || git checkout -b dev---InfinityFree origin/dev---InfinityFree
          git merge origin/main --no-edit
          git push origin dev---InfinityFree
